name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir
        id: find
        run: |
          mkdir extracted
          unzip -q -o old-sneaking-*.zip -d extracted
          DIR=$(dirname "$(find extracted -name build.gradle | head -1)")
          echo "Proyecto en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: old-sneaking
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
